<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="NorthTech Engineering">
  <!-- Background card -->
  <rect x="0" y="0" width="48" height="48" rx="10" fill="#0C447C"/>
  <!-- Left vertical bar of N -->
  <line x1="11" y1="11" x2="11" y2="37" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Right vertical bar of N -->
  <line x1="37" y1="11" x2="37" y2="37" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Waveform diagonal — N crossbar as electrical signal -->
  <polyline
    points="11,11 15,24 19,9 24,39 29,23 37,37"
    fill="none"
    stroke="rgba(255,255,255,0.82)"
    stroke-width="2.6"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <!-- Subtle bottom glow line -->
  <line x1="6" y1="43" x2="42" y2="43" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
</svg>
