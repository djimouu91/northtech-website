<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="NorthTech Engineering">
  <!-- Geometric N — 4 parallel polylines, golden bronze -->
  <g fill="none" stroke="#8B6420" stroke-linecap="square" stroke-linejoin="miter">
    <!-- Outer N -->
    <polyline points="8,93  8,7  92,93  92,7"  stroke-width="2.4"/>
    <!-- Inner 1 -->
