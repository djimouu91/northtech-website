<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="NorthTech Engineering">
  <defs>
    <!-- / lines — left arm (rotate -32° = lean right = slash direction) -->
    <pattern id="sl" x="0" y="0" width="7" height="7"
      patternUnits="userSpaceOnUse"
      patternTransform="rotate(-32 50 50)">
      <line x1="3.5" y1="0" x2="3.5" y2="7" stroke="#8B6420" stroke-width="2.0"/>
    </pattern>

    <!-- \ lines — right arm (rotate +32° = lean left = backslash direction) -->
    <pattern id="bs" x="0" y="0" width="7" height="7"
      patternUnits="userSpaceOnUse"
      patternTransform="rotate(32 50 50)">
      <line x1="3.5" y1="0" x2="3.5" y2="7" stroke="#8B6420" stroke-width="2.0"/>
    </pattern>

    <!--
      N letter split at center (50,50):
      Left portion  = left bar + left half of crossbar
      Right portion = right half of crossbar + right bar
      Bars width ≈ 20px, total N from x=5 to x=95
    -->

    <!-- Clip: left arm pentagon -->
    <clipPath id="cl">
      <polygon points="5,10 25,10 50,50 25,90 5,90"/>
    </clipPath>

    <!-- Clip: right arm pentagon -->
    <clipPath id="cr">
      <polygon points="50,50 75,10 95,10 95,90 75,90"/>
    </clipPath>
  </defs>

  <!-- Left arm: / parallel lines -->
  <rect x="0" y="0" width="100" height="100" fill="url(#sl)" clip-path="url(#cl)"/>

  <!-- Right arm: \ parallel lines -->
  <rect x="0" y="0" width="100" height="100" fill="url(#bs)" clip-path="url(#cr)"/>
</svg>
